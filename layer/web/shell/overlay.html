<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JStarx Overlay</title>
<link rel="stylesheet" href="../common/theme.css">
<link rel="stylesheet" href="shell.css">
<style>
  /* The overlay is opaque: a frosted copy of the wallpaper (power friendly, always crisp). */
  body { background: #14032E; }
  #scrim { position: fixed; inset: 0; opacity: 1; background: linear-gradient(rgba(14, 2, 34, .52), rgba(14, 2, 34, .52)), var(--wall-blur) center / cover no-repeat; }
  #scrim.lp { background: linear-gradient(rgba(18, 3, 40, .38), rgba(18, 3, 40, .38)), var(--wall-blur) center / cover no-repeat; }
  .panel { position: fixed; z-index: 5; }
  .center-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
  .center-wrap > * { pointer-events: auto; }

  /* ---------- Launchpad ---------- */
  #launchpad { inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 74px; }
  #lp-search { width: 380px; height: 44px; border-radius: 99px; padding: 0 18px 0 44px; font-size: 16px;
    background: rgba(255,255,255,.12) no-repeat 16px 50% / 18px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), inset 0 1px 0 rgba(255,255,255,.3); }
  .lp-viewport { width: min(1180px, 90vw); flex: 1; overflow: hidden; margin-top: 34px; position: relative; }
  .lp-track { display: flex; height: 100%; will-change: transform; }
  .lp-page { flex: none; width: 100%; display: grid; grid-template-columns: repeat(var(--cols, 7), 1fr); align-content: start;
    justify-items: center; gap: 34px 8px; --icon: 78px; }
  .lp-page .app .label { font-size: 14px; }
  .lp-dots { display: flex; gap: 10px; justify-content: center; margin: 14px 0 118px; height: 10px; }
  .lp-dots button { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.35); transition: transform .3s var(--spring), background .2s; }
  .lp-dots button.on { background: #fff; transform: scale(1.35); }
  .lp-empty { grid-column: 1 / -1; color: var(--text-2); font-size: 16px; padding: 40px; }
  #lp-folder { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; }
  #lp-folder .fpanel { width: min(640px, 86vw); border-radius: 36px; padding: 24px 26px 30px; }
  #lp-folder h2 { margin: 0 0 18px; text-align: center; font-size: 24px; }
  #lp-folder .fgrid { display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center; gap: 18px 8px; --icon: 74px; }
  .sel .icon { box-shadow: 0 0 0 3px var(--o-300), 0 12px 24px -10px rgba(8,0,24,.8); }

  /* ---------- Start menu ---------- */
  #start { left: 0; right: 0; margin: 0 auto; width: 640px; bottom: 96px; padding: 22px 22px 14px; border-radius: 30px; }
  #start .search { width: 100%; height: 44px; border-radius: 14px; font-size: 15px; }
  #start .sec { display: flex; align-items: center; justify-content: space-between; margin: 18px 4px 10px; }
  #start .sec h3 { margin: 0; font-size: 14px; font-weight: 750; color: var(--text-2); }
  #start .pins { display: grid; grid-template-columns: repeat(6, 1fr); justify-items: center; gap: 10px 4px; --icon: 52px; }
  #start .pins .app .label { font-size: 12.5px; }
  #start .recs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rec { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; text-align: left; background: rgba(255,255,255,.06); }
  .rec:hover { background: rgba(255,255,255,.12); }
  .rec .ri { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-grad); color: #1a0a00; flex: none; }
  .rec .rt { font-weight: 700; font-size: 14px; } .rec .rs { font-size: 12.5px; color: var(--text-2); }
  #start .foot { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-grad); display: grid; place-items: center; font-weight: 800; color: #1a0a00; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.08); }
  .iconbtn:hover { background: rgba(255,255,255,.16); }
  .results { display: flex; flex-direction: column; gap: 4px; max-height: 340px; }
  .result { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; text-align: left; }
  .result:hover, .result.sel { background: rgba(255,255,255,.12); }
  .result img { width: 36px; height: 36px; border-radius: 10px; }

  /* ---------- Control center ---------- */
  #control { left: 0; right: 0; margin: 0 auto; top: 8px; width: 450px; padding: 16px; border-radius: 32px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 18px; text-align: left; min-height: 62px;
    background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: background .2s, transform .35s var(--spring); }
  .tile:active { transform: scale(.95); }
  .tile .ti { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); flex: none; }
  .tile.on .ti { background: var(--accent-grad); color: #1a0a00; }
  .tile .tt { font-weight: 700; font-size: 14px; } .tile .ts { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .cc-block { margin-top: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.06); }
  .cc-row { display: flex; align-items: center; gap: 12px; }
  .cc-row .slider { flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 13px; color: var(--text-2); }
  .stats b { display: block; color: var(--text); font-size: 17px; }
  .job { margin-top: 8px; } .job .jn { display: flex; justify-content: space-between; font-size: 13px; font-weight: 650; margin-bottom: 5px; }
  .notes { display: flex; flex-direction: column; gap: 8px; max-height: 230px; }
  .nrow { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.06); }
  .nrow .grow b { font-size: 13.5px; } .nrow .grow div { font-size: 12.5px; color: var(--text-2); }
  .cc-foot { display: flex; gap: 8px; margin-top: 12px; }

  /* ---------- Spark ask ---------- */
  #spark { left: 0; right: 0; margin: 0 auto; top: 8px; width: 660px; }
  #spark form { display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 10px 0 16px; border-radius: 30px; }
  #spark form img { width: 30px; height: 30px; }
  #spark form input { flex: 1; height: 40px; border: 0; background: transparent; font: inherit; font-size: 17px; color: var(--text); outline: none; }
  #spark .answer { margin-top: 12px; padding: 18px 20px; border-radius: 26px; font-size: 15.5px; line-height: 1.55; white-space: pre-wrap; min-height: 60px; max-height: 50vh; }
  #spark .answer .cursor { display: inline-block; width: 8px; height: 18px; background: var(--o-300); vertical-align: -3px; animation: pulse 1s infinite; border-radius: 2px; }
  #spark .acts { display: flex; gap: 8px; margin-top: 12px; }

  /* ---------- Power ---------- */
  #power { padding: 28px; border-radius: 34px; text-align: center; }
  #power h2 { margin: 0 0 6px; font-size: 22px; } #power p { margin: 0 0 22px; color: var(--text-2); }
  .pbtns { display: flex; gap: 22px; }
  .pbtn { display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 650; }
  .pbtn .pc { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), inset 0 1px 0 rgba(255,255,255,.3); transition: transform .35s var(--spring), background .2s; }
  .pbtn .pc .ico { width: 30px; height: 30px; }
  .pbtn:hover .pc { background: var(--accent-grad); color: #1a0a00; transform: scale(1.08); }

  /* ---------- Welcome ---------- */
  #welcome { width: 640px; padding: 34px 36px 26px; border-radius: 38px; text-align: center; }
  #welcome h1 { margin: 10px 0 6px; font-size: 32px; letter-spacing: -.02em; }
  #welcome p { margin: 0 0 18px; color: var(--text-2); font-size: 16px; }
  #welcome .logo { width: 120px; height: 120px; }
  #welcome .wsteps { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
  #welcome .wsteps i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3); }
  #welcome .wsteps i.on { background: var(--o-300); transform: scale(1.3); }
  .walls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .walls button { border-radius: 14px; overflow: hidden; aspect-ratio: 16/10; box-shadow: inset 0 0 0 2px transparent; transition: transform .3s var(--spring); }
  .walls button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .walls button.on { box-shadow: 0 0 0 3px var(--o-300); transform: scale(1.05); }
  .wifi-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; text-align: left; }
  .wifi-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); }
</style>
</head>
<body>
<div id="scrim"></div>

<section id="launchpad" class="panel hidden">
  <input id="lp-search" class="field" placeholder="Search apps" autocomplete="off">
  <div class="lp-viewport" id="lp-viewport"><div class="lp-track" id="lp-track"></div></div>
  <div class="lp-dots" id="lp-dots"></div>
</section>
<div id="lp-folder" class="hidden"></div>

<section id="start" class="panel glass strong fixed-bg hidden"></section>
<section id="control" class="panel glass strong fixed-bg hidden"></section>
<section id="spark" class="panel hidden"></section>
<div class="center-wrap hidden" id="power-wrap"><section id="power" class="glass strong fixed-bg"></section></div>
<div class="center-wrap hidden" id="welcome-wrap"><section id="welcome" class="glass strong fixed-bg"></section></div>

<script src="../common/starx.js"></script>
<script src="common.js"></script>
<script src="overlay.js"></script>
</body>
</html>
