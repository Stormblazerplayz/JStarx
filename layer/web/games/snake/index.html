<!doctype html>
<html><head><meta charset="utf-8"><title>Star Snake</title>
<link rel="stylesheet" href="../../common/theme.css"><link rel="stylesheet" href="../games.css"></head>
<body>
<div class="hud"><span>Score <span class="score" id="score">0</span></span><span class="faint">Best <span id="best">0</span></span><span class="grow"></span><span class="faint">Arrows / WASD · P pauses</span></div>
<div class="stage"><canvas id="game"></canvas><div id="overlay"></div></div>
<script src="../../common/starx.js"></script><script src="../games.js"></script>
<script>
(function () {
  const G = window.Game, S = window.StarX;
  const CELL = 26;
  let cols, rows, snake, dir, queue, food, bonus, score, stepT, speed, alive, t = 0;
  function free() { let p; do { p = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) }; } while (snake.some(s => s.x === p.x && s.y === p.y)); return p; }
  function reset() {
    cols = Math.max(12, Math.floor(G.w / CELL)); rows = Math.max(10, Math.floor(G.h / CELL));
    const cx = Math.floor(cols / 3), cy = Math.floor(rows / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 }; queue = []; food = free(); bonus = null; score = 0; stepT = 0; speed = .115; alive = true;
    document.getElementById('score').textContent = 0;
  }
  function turn(x, y) {
    const last = queue.length ? queue[queue.length - 1] : dir;
    if ((x === -last.x && y === -last.y) || (x === last.x && y === last.y) || queue.length > 2) return;
    queue.push({ x, y });
  }
  function addScore(n) {
    score += n; const el = document.getElementById('score'); el.textContent = score;
    S.spring(el, { scale: 1.6 }, { scale: 1 }, { damping: .35 });
  }
  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) return die();
    snake.unshift(head);
    const ox = (cols * CELL - G.w) / -2, oy = (rows * CELL - G.h) / -2;
    if (head.x === food.x && head.y === food.y) {
      addScore(1); G.burst(ox + head.x * CELL + CELL / 2, oy + head.y * CELL + CELL / 2, '#FFD166', 22);
      food = free(); speed = Math.max(.06, speed * .975);
      if (!bonus && Math.random() < .22) bonus = Object.assign(free(), { ttl: 6 });
    } else if (bonus && head.x === bonus.x && head.y === bonus.y) {
      addScore(5); G.burst(ox + head.x * CELL + CELL / 2, oy + head.y * CELL + CELL / 2, '#FF8A00', 34, 300); bonus = null; snake.push({ ...snake[snake.length - 1] });
    } else snake.pop();
  }
  function die() {
    alive = false; G.shake = 18;
    const ox = (cols * CELL - G.w) / -2, oy = (rows * CELL - G.h) / -2;
    snake.forEach((s, i) => i % 2 || G.burst(ox + s.x * CELL + 13, oy + s.y * CELL + 13, '#C77DFF', 6, 160));
    const rec = G.saveBest(score);
    setTimeout(() => { G.stop(); G.screen('Game over', `You ate <b>${score}</b> star${score === 1 ? '' : 's'}${rec ? ' · New best! 🎉' : ''}`, '<button class="btn primary" id="again" style="margin-top:12px">Play again</button><div class="keys">Space or click to play</div>'); }, 700);
  }
  function update(dt) {
    t += dt;
    if (G.pressed.has('KeyP') || G.pressed.has('Escape')) return G.pause(true);
    if (!alive) return;
    if (G.left()) turn(-1, 0); else if (G.right()) turn(1, 0); else if (G.up()) turn(0, -1); else if (G.down()) turn(0, 1);
    if (bonus && (bonus.ttl -= dt) <= 0) bonus = null;
    stepT += dt; while (stepT >= speed) { stepT -= speed; step(); if (!alive) break; }
  }
  function draw(c) {
    c.clearRect(0, 0, G.w, G.h);
    const ox = (G.w - cols * CELL) / 2, oy = (G.h - rows * CELL) / 2;
    c.fillStyle = 'rgba(255,255,255,.05)';
    for (let x = 0; x < cols; x++) for (let y = 0; y < rows; y++) c.fillRect(ox + x * CELL + CELL / 2 - 1, oy + y * CELL + CELL / 2 - 1, 2, 2);
    c.strokeStyle = 'rgba(199,125,255,.35)'; c.lineWidth = 2; G.roundRect(c, ox - 3, oy - 3, cols * CELL + 6, rows * CELL + 6, 12); c.stroke();
    const pulse = 1 + Math.sin(t * 6) * .12;
    c.shadowColor = '#FFD166'; c.shadowBlur = 18; G.star(c, ox + food.x * CELL + CELL / 2, oy + food.y * CELL + CELL / 2, 11 * pulse, '#FFD166', t);
    if (bonus) { c.shadowColor = '#FF8A00'; G.star(c, ox + bonus.x * CELL + CELL / 2, oy + bonus.y * CELL + CELL / 2, 14 * pulse, bonus.ttl < 2 && Math.floor(t * 8) % 2 ? '#ffffff' : '#FF8A00', -t * 2); }
    c.shadowBlur = 14; c.shadowColor = '#9D4EDD';
    snake.forEach((s, i) => {
      const k = i / Math.max(1, snake.length - 1);
      c.fillStyle = `rgb(${Math.round(224 - 101 * k)},${Math.round(170 - 126 * k)},${Math.round(255 - 64 * k)})`;
      G.roundRect(c, ox + s.x * CELL + 2, oy + s.y * CELL + 2, CELL - 4, CELL - 4, 8); c.fill();
    });
    c.shadowBlur = 0;
    const h = snake[0]; c.fillStyle = '#10002B';
    const ex = dir.y !== 0 ? 5 : 0, ey = dir.x !== 0 ? 5 : 0;
    [[-1], [1]].forEach(([s]) => { c.beginPath(); c.arc(ox + h.x * CELL + 13 + dir.x * 4 + s * ex, oy + h.y * CELL + 13 + dir.y * 4 + s * ey, 3, 0, 6.283); c.fill(); });
  }
  G.init('snake', update, draw);
  const begin = () => { reset(); G.start(); };
  document.getElementById('overlay').addEventListener('click', () => G.paused ? G.pause(false) : begin());
  addEventListener('keydown', e => { if (!G.running && (e.code === 'Space' || e.code === 'Enter')) begin(); else if (G.paused && (e.code === 'KeyP' || e.code === 'Space')) G.pause(false); });
  setTimeout(() => G.screen('Star Snake', 'Eat the stars, grow longer, and don\'t bump into the walls or yourself. Orange comets are worth 5!', '<button class="btn primary" style="margin-top:12px">Play</button><div class="keys">Arrows / WASD / gamepad · P to pause</div>'), 50);
})();
</script></body></html>
