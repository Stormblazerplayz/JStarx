<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Star Store</title>
<link rel="stylesheet" href="../../common/theme.css">
<link rel="stylesheet" href="../app.css">
<style>
  body { overflow: auto; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 26px 30px 50px; }
  .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; padding: 28px; border-radius: 30px; margin-bottom: 22px; }
  .hero h1 { margin: 0; font-size: 34px; letter-spacing: -.02em; }
  .hero p { color: var(--text-2); margin: 8px 0 18px; font-size: 16px; }
  .feat { display: flex; gap: 16px; align-items: center; padding: 18px; border-radius: 22px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .feat img { width: 84px; height: 84px; }
  .chips { display: flex; gap: 8px; margin: 6px 0 18px; flex-wrap: wrap; }
  .chips button { padding: 8px 16px; border-radius: 99px; font-weight: 700; background: rgba(255,255,255,.08); }
  .chips button.on { background: linear-gradient(135deg, #9D4EDD, #FF8A00); color: #1a0a00; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .app-card { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 22px; background: rgba(255,255,255,.055);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); transition: transform .4s var(--spring), background .2s; }
  .app-card:hover { transform: translateY(-3px); background: rgba(255,255,255,.08); }
  .app-card img { width: 64px; height: 64px; flex: none; }
  .app-card .nm { font-weight: 750; font-size: 16px; }
  .app-card .ds { font-size: 13px; color: var(--text-2); margin: 2px 0 8px; }
  .app-card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .app-card .act { margin-left: auto; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex: none; }
  .prog { font-size: 12px; color: var(--o-200); max-width: 160px; text-align: right; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .top input { flex: 1; max-width: 360px; }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero glass strong fixed-bg">
    <div><h1>Star Store</h1><p>Official JStarx apps. Nothing extra comes pre-installed, so add only what you want.</p>
      <div class="chip accent"></div></div>
    <div class="feat" id="feat"></div>
  </section>
  <div class="top"><input class="field" id="q" placeholder="Search apps"><button class="btn small" id="refresh">Refresh</button><span class="faint" id="note"></span></div>
  <div class="chips" id="cats"></div>
  <div class="grid" id="grid"></div>
</div>
<script src="../../common/starx.js"></script>
<script src="store.js"></script>
</body>
</html>
