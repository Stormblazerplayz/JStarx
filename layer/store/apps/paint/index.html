<!doctype html><html><head><meta charset="utf-8"><title>Star Paint</title>
<script>document.write(`<link rel="stylesheet" href="${STARX_CONTEXT.web}/common/theme.css"><link rel="stylesheet" href="${STARX_CONTEXT.web}/apps/app.css"><script src="${STARX_CONTEXT.web}/common/starx.js"><\/script>`);</script>
<style>
 body{display:flex;flex-direction:column} .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
 .sw{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);transition:transform .3s var(--spring)} .sw.on{transform:scale(1.25);box-shadow:0 0 0 3px #fff}
 #wrap{flex:1;padding:16px;min-height:0} canvas{width:100%;height:100%;border-radius:18px;background:#fff;box-shadow:var(--shadow);cursor:crosshair;touch-action:none}
</style></head><body>
<div class="bar"><div id="sw" class="row"></div><span class="faint">Size</span><input type="range" class="slider" id="size" min="2" max="60" value="10" style="width:140px">
<button class="btn small" id="glow">✨ Glow: off</button><button class="btn small" id="eraser">Eraser</button><button class="btn small" id="undo">Undo</button><button class="btn small danger" id="clear">Clear</button><span class="grow"></span><button class="btn small primary" id="save">Save to Pictures</button></div>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function(){
 const S=StarX,$=S.$, cv=$('#c'), ctx=cv.getContext('2d'); const colors=['#10002B','#7B2CBF','#C77DFF','#FF8A00','#FFD166','#FF6B81','#2BD48A','#4FA3FF','#ffffff'];
 let color='#7B2CBF', erase=false, glow=false, drawing=false, last=null; const undo=[];
 $('#sw').innerHTML=colors.map(c=>`<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('');
 $('#sw').onclick=e=>{ const b=e.target.closest('.sw'); if(!b) return; color=b.dataset.c; erase=false; S.$$('.sw').forEach(x=>x.classList.toggle('on',x===b)); S.boing(b,.3); };
 function fit(){ const img=cv.width?ctx.getImageData(0,0,cv.width,cv.height):null; const r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); if(img) ctx.putImageData(img,0,0); }
 new ResizeObserver(fit).observe(cv);
 const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
 cv.onpointerdown=e=>{ drawing=true; last=pos(e); undo.push(ctx.getImageData(0,0,cv.width,cv.height)); if(undo.length>20) undo.shift(); cv.setPointerCapture(e.pointerId); line(last,last); };
 cv.onpointermove=e=>{ if(!drawing) return; const p=pos(e); line(last,p); last=p; };
 cv.onpointerup=()=>{ drawing=false; };
 function line(a,b){ ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=+$('#size').value; ctx.strokeStyle=erase?'#fff':color; ctx.shadowBlur=glow&&!erase?18:0; ctx.shadowColor=color; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
 $('#glow').onclick=()=>{ glow=!glow; $('#glow').textContent='✨ Glow: '+(glow?'on':'off'); };
 $('#eraser').onclick=()=>{ erase=true; S.$$('.sw').forEach(x=>x.classList.remove('on')); };
 $('#undo').onclick=()=>{ const u=undo.pop(); if(u) ctx.putImageData(u,0,0); };
 $('#clear').onclick=()=>{ undo.push(ctx.getImageData(0,0,cv.width,cv.height)); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); };
 $('#save').onclick=async()=>{ try{ const p=await S.call('files.save_image',{name:'Star Paint '+new Date().toISOString().slice(0,10),data_url:cv.toDataURL('image/png')}); S.toast('Saved to '+p); }catch(e){ S.toast(e.message); } };
})();
</script></body></html>
