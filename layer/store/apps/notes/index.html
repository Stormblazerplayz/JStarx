<!doctype html><html><head><meta charset="utf-8"><title>Star Notes</title>
<script>document.write(`<link rel="stylesheet" href="${STARX_CONTEXT.web}/common/theme.css"><link rel="stylesheet" href="${STARX_CONTEXT.web}/apps/app.css"><script src="${STARX_CONTEXT.web}/common/starx.js"><\/script>`);</script>
<style>
 .layout{grid-template-columns:280px 1fr}
 .note{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;margin-bottom:4px}
 .note:hover{background:rgba(255,255,255,.07)} .note.on{background:rgba(255,138,0,.14);box-shadow:inset 0 0 0 1px rgba(255,159,67,.5)}
 .note b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .note span{font-size:12px;color:var(--text-3)}
 #title{font:700 26px var(--font);background:none;border:0;outline:none;color:var(--text);width:100%;margin-bottom:8px}
 #body{width:100%;height:calc(100% - 70px);background:none;border:0;outline:none;color:var(--text);font:16px/1.6 var(--font);resize:none}
 .main{display:flex;flex-direction:column}
</style></head><body>
<div class="layout"><aside class="side"><div class="row" style="padding:0 4px 8px"><input class="field grow" id="q" placeholder="Search notes"><button class="btn small primary" id="new">New</button></div><div class="nav" id="list"></div></aside>
<main class="main"><input id="title" placeholder="Title"><textarea id="body" placeholder="Start typing…"></textarea><div class="row" style="justify-content:space-between"><span class="faint" id="saved">Saved</span><button class="btn small danger" id="del">Delete note</button></div></main></div>
<script>
(async function(){
 const S=StarX,$=S.$; let notes=(await S.call('appdata.get',{key:'notes'}).catch(()=>null))||[]; let cur=null, t=null;
 if(!notes.length) notes=[{id:Date.now(),title:'Welcome to Star Notes',body:'Notes save by themselves.\nMake a new one with the New button.',time:Date.now()}];
 const save=()=>{ clearTimeout(t); $('#saved').textContent='Saving…'; t=setTimeout(async()=>{ await S.call('appdata.set',{key:'notes',value:notes}).catch(e=>S.toast(e.message)); $('#saved').textContent='Saved'; },400); };
 function list(){ const q=$('#q').value.toLowerCase(); $('#list').innerHTML=notes.filter(n=>!q||(n.title+n.body).toLowerCase().includes(q)).sort((a,b)=>b.time-a.time).map(n=>`<button class="note ${cur&&n.id===cur.id?'on':''}" data-id="${n.id}"><b>${S.esc(n.title||'Untitled')}</b><span>${new Date(n.time).toLocaleString()}</span></button>`).join(''); }
 function open(n){ cur=n; $('#title').value=n.title; $('#body').value=n.body; list(); }
 $('#list').onclick=e=>{ const b=e.target.closest('.note'); if(b) open(notes.find(n=>n.id==b.dataset.id)); };
 $('#new').onclick=()=>{ const n={id:Date.now(),title:'',body:'',time:Date.now()}; notes.push(n); open(n); $('#title').focus(); save(); };
 $('#del').onclick=()=>{ if(!cur) return; notes=notes.filter(n=>n!==cur); save(); notes.length?open(notes[0]):$('#new').click(); };
 $('#title').oninput=()=>{ cur.title=$('#title').value; cur.time=Date.now(); list(); save(); };
 $('#body').oninput=()=>{ cur.body=$('#body').value; cur.time=Date.now(); save(); };
 $('#q').oninput=list; open(notes.sort((a,b)=>b.time-a.time)[0]);
})();
</script></body></html>
