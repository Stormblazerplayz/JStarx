# Builds the JStarx OS SD card image for the Jetson Nano, and the whole-system update.
# Runs for pull requests, from the Actions tab ("Run workflow"), for pushes to main and for tags
# like v1.0.0. Pushes to main and tags publish the release "v<version>" (version from layer/layer.json)
# with the SD card image; pushes to main also publish a "system-N" release that Jetsons install as a
# whole-system update. Every run also keeps the files under the run's "Artifacts".
name: Build JStarx OS image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["os/**", "layer/**", "default.nix", ".github/workflows/build-image.yml"]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sd-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Let this PC run ARM64 programs (QEMU)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-platforms = aarch64-linux

      - name: Run the JStarx tests
        run: |
          nix-shell -E 'with import (import ./os/nixpkgs.nix) {}; mkShell { packages = [ (python3.withPackages (ps: [ ps.pytest ps.numpy ])) ]; }' --run 'python -m pytest -q tests'

      - name: Build the SD card image (StarX Kernel + JStarx OS)
        run: nix-build -A sdImage -o result-sd

      - name: Compress the image
        run: |
          version=$(jq -r .version layer/layer.json)
          echo "JSTARX_VERSION=$version" >> "$GITHUB_ENV"
          mkdir out
          xz -T0 -6 -c result-sd/sd-image/*.img > "out/jstarx-${version}-jetson-nano.img.xz"
          ls -lh out

      - name: Make the whole-system update
        run: |
          sys=$(nix-build -A toplevel --no-out-link)
          nix-store -qR "$sys" > closure.txt
          : > ours.txt; : > deps.txt
          # what cache.nixos.org already has, the Jetson downloads from there; the rest is ours
          while read -r p; do
            h=$(basename "$p" | cut -c1-32)
            if curl -sfI --retry 3 "https://cache.nixos.org/$h.narinfo" >/dev/null; then echo "$p" >> deps.txt; else echo "$p" >> ours.txt; fi
          done < closure.txt
          echo "$(wc -l < ours.txt) JStarx paths, $(wc -l < deps.txt) from cache.nixos.org"
          mkdir syscache
          xargs nix --extra-experimental-features nix-command copy --no-recursive --no-check-sigs \
            --to "file://$PWD/syscache?compression=zstd" < ours.txt
          printf 'StoreDir: /nix/store\nWantMassQuery: 0\nPriority: 30\n' > syscache/nix-cache-info
          tar -C syscache -cf - . | zstd -T0 -10 > out/system-cache.tar.zst
          jq -n --arg system "$sys" --arg version "$(jq -r .version layer/layer.json)" --rawfile deps deps.txt \
            '{system: $system, version: $version, deps: ($deps | split("\n") | map(select(length > 0)))}' > out/system.json
          (cd out && sha256sum * > SHA256SUMS)
          ls -lh out

      - name: Save the image and the system update
        uses: actions/upload-artifact@v4
        with:
          name: jstarx-sd-image
          path: out/
          compression-level: 0

      - name: Publish the whole-system update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: system-${{ github.run_number }}
          name: JStarx system update ${{ github.run_number }}
          body: Whole-system update for JStarx OS. Jetsons install it from Settings → Updates (or automatically).
          make_latest: false
          files: |
            out/system.json
            out/system-cache.tar.zst

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          jq -r '"JStarx \(.version) (\(.codename)) for the Jetson Nano.\n\n" +
            "**Install:** download `jstarx-\(.version)-jetson-nano.img.xz`, flash it to a microSD card (32 GB or bigger) " +
            "with balenaEtcher, put the card in the Jetson Nano and turn it on.\n\n### New in \(.version)\n" +
            (.notes | map("- " + .) | join("\n"))' layer/layer.json > release-notes.md
          cat release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.JSTARX_VERSION) }}
          target_commitish: ${{ github.sha }}
          name: JStarx ${{ env.JSTARX_VERSION }}
          body_path: release-notes.md
          make_latest: true
          files: |
            out/jstarx-*.img.xz
            out/SHA256SUMS
            out/system.json
            out/system-cache.tar.zst
